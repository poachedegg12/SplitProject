[Mod]
name = Pizza Tower R
description = Have you ever wanted to play Pizza Tower, but in Reverse?

              This mod gives EVERY level an "R" variation, from simple John Gutter to the courses of GOLF to the Crumbling Tower itself, swapping the start gate and Pillar John around and making you play them backwards! Some platforms have been removed and red girders have been added to make sure these R variants flow (close to) as well as their normal counterparts. (if it wasnt obvious, yes i was partially inspired by Mario Kart Tour when i started making this mod lol)

              For a bonus challenge, Gerome and the Treasure Room door have been swapped too, and all Secrets are played in reverse as well. Nonetheless all levels are P-Rankable! Keep an eye out for purple pizza boxes to guide you to the treasure door once you get Gerome!

              Other random stuff added to this mod include:

              Custom titlecards
              Oregano Desert and Peppibot Factory's old escape BGs, with custom ones added for BGs that didn't have an escape version before
              A really basic Lap 3, cuz why not? (None of the levels have been reworked for lapping though! Some may be impossible!)
              CTOP Lap 2, again cuz why not
              A deteriorated level of sand in what remains of the Hub Rooms.


              I spent WAY too long making this; after the Halloween and Noise updates reset all my progress on this mod, I'm happy to finally release it in full! Hope you enjoy!

