description = Please ask before you use any assets exclusive to Hotfix, and don't take them without my explicit permission! That's all I ask.I'm cool with reskin mods! Go right ahead and post your reskins if you make 'em! Just be sure to link the page!For more info, read the ORIGINAL MOD's descripton!AND PLEASE, SUPPORT THE ORIGINAL AUTHOR! This mod was initially a mod of their own, but has been built to be its own thing now.Originally starting as a fix of sorts for the Lap HELL mod, this "hotfix" ended up turning into a sorta re-haul of said mod, adding a bunch of little features, small extras, and of course, keeping it up-to-date with PT's version itself!Now fully realized for the Noise Update (and with a new name as well), Lap Hell - Pizza Pursuit features 3 extra laps of challenging, porcupine-hating, and spirit-scaring action!- Take on up to Lap 5, with each lap introducing a new threat or two!- A new toggle PC with many toggles and a new LUNATIC difficulty that pushes the threats' scariness to the max with new mechanics for each!- The ability to add in custom lapping music!- Plenty of clothes to unlock through various means, and someone to potentially help you scout them out...- NEW Badges for each lap completion, character, and difficulty! Try to get 'em all (if you want to)!- Snick.exe brings in a friend to take his place if you play as Noise, with, of course, all new transitions and such for everything Noise related! (Plus some shenanigans...)- Extra support and mechanics for Swap Mode, as well as a special extra on if you play with a friend (or foe)!- An unlockable remade successor to the original LAP HELL mode, where you can traverse as many laps as you can while focusing on a high score! (As well as some extra threats...)Any foes with a white trail in LAP HELL are parryable!- Tons of other little things, just to make the experience as silly, and/or fun as possible.If you want a challenging, nail-biting lapping experience, this is the place for you!
